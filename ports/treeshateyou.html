<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Trees Hate You</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000;
            font-family: monospace;
        }
        #unity-container { 
            width: 100vw !important; 
            height: 100vh !important; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        #unity-canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block;
        }
        #custom-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        .progress-container {
            width: 200px;
            height: 4px;
            background: #222222;
            margin-bottom: 10px;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.1s linear;
        }
        #loader-status {
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="custom-loader">
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
        <div id="loader-status">0%</div>
    </div>
    <script>
        // The game files live in thirstygithub/fugglelatougin. jsDelivr sometimes answers big files with a
        // 200 "429: Too Many Requests" page, so every piece is size-checked and retried on other mirrors.
        const REPO = "thirstygithub/fugglelatougin";
        const REF = "64b65ba";
        const BASES = [
            `https://cdn.jsdelivr.net/gh/${REPO}@${REF}/Build/`,
            `https://raw.githubusercontent.com/${REPO}/${REF}/Build/`,
            `https://cdn.jsdelivr.net/gh/${REPO}@main/Build/`,
            `https://raw.githubusercontent.com/${REPO}/main/Build/`
        ];
        const SIZES = {
            "TreesHateYou_Web.data.br.part0": 20971520,
            "TreesHateYou_Web.data.br.part1": 20971520,
            "TreesHateYou_Web.data.br.part2": 20971520,
            "TreesHateYou_Web.data.br.part3": 20971520,
            "TreesHateYou_Web.data.br.part4": 480614,
            "TreesHateYou_Web.wasm.br.part0": 20971520,
            "TreesHateYou_Web.wasm.br.part1": 20971520,
            "TreesHateYou_Web.wasm.br.part2": 20971520,
            "TreesHateYou_Web.wasm.br.part3": 7433037
        };
        const loaderStatus = document.getElementById('loader-status');
        const progressFill = document.getElementById('progress-fill');
        const customLoader = document.getElementById('custom-loader');

        function updateProgress(percent) {
            if (percent !== null) {
                const p = Math.min(100, Math.max(0, Math.round(percent)));
                progressFill.style.width = p + '%';
                loaderStatus.innerText = p + '%';
            }
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Returns the file's bytes from the first mirror that gives a complete, valid copy
        async function fetchVerified(name) {
            const expected = SIZES[name];
            for (const base of BASES) {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const r = await fetch(base + name + (attempt > 1 ? "?t=" + Date.now() : ""));
                        if (r.ok) {
                            const buf = await r.arrayBuffer();
                            const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(4, buf.byteLength)));
                            if (expected ? buf.byteLength === expected : (buf.byteLength > 0 && head !== "429:")) return buf;
                        }
                    } catch (e) { /* try the next copy */ }
                    await sleep(300 * attempt);
                }
            }
            throw new Error("Failed: " + name);
        }

        async function fetchChunks(name, parts, progressStart, progressEnd) {
            const buffers = [];
            let total = 0;
            for (let i = 0; i < parts; i++) {
                updateProgress(progressStart + ((i / parts) * (progressEnd - progressStart)));
                const buf = await fetchVerified(name + ".part" + i);
                buffers.push(buf);
                total += buf.byteLength;
            }
            const out = new Uint8Array(total);
            let off = 0;
            for (const b of buffers) { out.set(new Uint8Array(b), off); off += b.byteLength; }
            return out;
        }

        async function boot() {
            try {
                const dataBytes = await fetchChunks("TreesHateYou_Web.data.br", 5, 0, 40);
                const dataUrl = URL.createObjectURL(new Blob([dataBytes]));

                updateProgress(45);
                const fwUrl = URL.createObjectURL(new Blob([await fetchVerified("TreesHateYou_Web.framework.js.br")], { type: "application/javascript" }));

                const wasmBytes = await fetchChunks("TreesHateYou_Web.wasm.br", 4, 50, 90);
                const wasmUrl = URL.createObjectURL(new Blob([wasmBytes], { type: "application/wasm" }));

                updateProgress(90);
                var canvas = document.querySelector("#unity-canvas");

                var config = {
                    arguments: [],
                    dataUrl: dataUrl,
                    frameworkUrl: fwUrl,
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "tykenn games",
                    productName: "Trees Hate You",
                    productVersion: "0.1.0",
                };

                updateProgress(92);
                const loaderUrl = URL.createObjectURL(new Blob([await fetchVerified("TreesHateYou_Web.loader.js")], { type: "application/javascript" }));
                const script = document.createElement("script");
                script.src = loaderUrl;
                script.onerror = () => { loaderStatus.innerText = "Error"; console.error("Could not start the Unity loader"); };
                script.onload = () => {
                    updateProgress(95);
                    createUnityInstance(canvas, config, (progress) => {
                        updateProgress(95 + (progress * 5));
                    }).then((unityInstance) => {
                        updateProgress(100);
                        customLoader.style.opacity = '0';
                        setTimeout(() => customLoader.style.display = 'none', 300);
                    }).catch((message) => {
                        loaderStatus.innerText = "Error";
                        console.error(message);
                        alert(message);
                    });
                };
                document.head.appendChild(script);

            } catch(err) {
                loaderStatus.innerText = "Error";
                console.error(err);
            }
        }

        boot();
    </script>
</body>
</html>
