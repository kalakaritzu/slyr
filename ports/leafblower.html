<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leaf Blower Revolution</title>
<link rel="icon" href="leafblower/favicon.ico">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100vw;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font:16px system-ui;background:#101010;z-index:10;text-align:center;padding:0 20px}
#loading .bar{width:min(340px,80vw);height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#loading .fill{width:0%;height:100%;background:#7fd45a;transition:width .2s linear}
#loading .detail{font-size:13px;color:rgba(255,255,255,.6);min-height:1.2em}
#loading .credit{position:absolute;bottom:14px;font-size:12px;color:rgba(255,255,255,.4)}
#loading button{display:none;margin-top:4px;padding:8px 18px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;cursor:pointer;font:14px system-ui}
</style>
</head>
<body>
<div id="loading"><div class="text">Downloading the game...</div><div class="bar"><div class="fill"></div></div><div class="detail"></div><button type="button" onclick="location.reload()">Try again</button><div class="credit">Web port by mtnskye</div></div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
// The game's data file (51 MB) lives in mtnskye/LeafBlowerRevolutionWebPort (pinned to one version). It is size-checked, retried,
// and kept in the browser's cache; the runner is then handed it whenever it asks for game.unx.
var REPO = "mtnskye/LeafBlowerRevolutionWebPort", REF = "e595112926dccb7422c7bea4febf43e41d7372eb", UNX_SIZE = 51455014;
var gameBlobUrl = null;
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var realFetch = window.fetch.bind(window);
  function fail(err) {
    $("#loading .text").textContent = "Game loading failed: " + (err && err.message || err);
    $("#loading button").style.display = "block";
    console.error(err);
  }
  async function getUnx() {
    var cache = null;
    try { cache = await caches.open("leafblower-" + REF.slice(0, 7)); } catch (e) {}
    if (cache) { try { var hit = await cache.match("/__lbr/game.unx"); if (hit) { var hb = await hit.blob(); if (hb.size === UNX_SIZE) return hb; } } catch (e) {} }
    var urls = ["https://raw.githubusercontent.com/" + REPO + "/" + REF + "/game.unx"];
    for (var attempt = 1; attempt <= 4; attempt++) {
      try {
        var r = await realFetch(urls[0] + (attempt > 2 ? "?t=" + Date.now() : ""));
        if (!r.ok) throw new Error("http " + r.status);
        var reader = r.body.getReader(), parts = [], got = 0;
        for (;;) {
          var s = await reader.read();
          if (s.done) break;
          parts.push(s.value); got += s.value.length;
          $("#loading .fill").style.width = Math.min(100, got / UNX_SIZE * 100).toFixed(1) + "%";
          $("#loading .detail").textContent = Math.round(got / 1048576) + " MB of " + Math.round(UNX_SIZE / 1048576) + " MB";
        }
        var b = new Blob(parts, { type: "application/octet-stream" });
        if (b.size === UNX_SIZE) {
          if (cache) { try { await cache.put("/__lbr/game.unx", new Response(b)); } catch (e) {} }
          return b;
        }
      } catch (e) { /* try again */ }
      await sleep(500 * attempt);
    }
    throw new Error("Could not download the game data");
  }
  // anything that asks for game.unx gets the downloaded copy
  var isUnx = function (u) { return String(u).split("?")[0].split("/").pop() === "game.unx"; };
  var xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) { if (gameBlobUrl && isUnx(u)) arguments[1] = gameBlobUrl; return xo.apply(this, arguments); };
  window.fetch = function (input, init) {
    var u = typeof input === "string" ? input : (input instanceof URL ? input.href : (input && input.url));
    if (gameBlobUrl && u && isUnx(u)) return realFetch(gameBlobUrl, init);
    return realFetch(input, init);
  };
  getUnx().then(function (blob) {
    gameBlobUrl = URL.createObjectURL(blob);
    $("#loading .text").textContent = "Starting the game...";
    var rt = "leafblower/js/";
    window.Module = {
      canvas: document.getElementById("canvas"),
      locateFile: function (path) { return isUnx(path) ? gameBlobUrl : rt + path; },
      setStatus: function (text) { document.title = text ? text + " — Leaf Blower Revolution" : "Leaf Blower Revolution"; },
      monitorRunDependencies: function (left) { if (left === 0) { var el = document.getElementById("loading"); if (el) el.remove(); document.title = "Leaf Blower Revolution"; } }
    };
    window.addEventListener("error", function (e) { console.error("Game startup error:", e.message, e.filename, e.lineno); });
    // Standalone fallback: GX normally supplies these manifest helpers (this archive uses the legacy runner and has no manifest list).
    window.manifestFiles = window.manifestFiles || function () { return ""; };
    window.manifestFilesMD5 = window.manifestFilesMD5 || function () { return []; };
    window.manifestFiles = window.manifestFiles; window.manifestFilesMD5 = window.manifestFilesMD5;
    // GameMaker runner callbacks, normally defined by the stock GameMaker page
    window.g_pAddAsyncMethod = -1;
    window.setAddAsyncMethod = function (f) { window.g_pAddAsyncMethod = f; };
    window.g_pWadLoadCallback = null;
    window.setWadLoadCallback = function (f) { window.g_pWadLoadCallback = f; };
    var s = document.createElement("script");
    s.src = rt + "runner.js";
    s.onerror = function () { fail(new Error("Could not load the game runner.")); };
    document.body.appendChild(s);
  }).catch(fail);
})();
</script>
</body>
</html>
