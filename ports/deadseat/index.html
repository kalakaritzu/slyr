<script>
// The game uses threads, which need cross-origin isolation. A service worker supplies the headers; the page reloads once after it is installed.
if (!window.crossOriginIsolated && "serviceWorker" in navigator) {
	navigator.serviceWorker.register("coi-sw.js").then((reg) => {
		const go = () => { if (!sessionStorage.getItem("coi-reloaded")) { sessionStorage.setItem("coi-reloaded", "1"); location.reload(); } };
		if (reg.active && !navigator.serviceWorker.controller) go();
		else navigator.serviceWorker.addEventListener("controllerchange", go);
	}).catch((e) => console.error("coi", e));
}
</script>

// Loads "The Deadseat.pck" from two split parts (same folder as this page) and joins them in the browser.
// If your parts have different names, edit the two names in the list below.
// The game's data (about 230 MB) is loaded from TheBlehLollipop/The-Deadseat-Webport, pinned to one version.
const DATA_BASE = "https://raw.githubusercontent.com/TheBlehLollipop/The-Deadseat-Webport/d16e24666b333689d9431990406f01b8e03e9cca/";
const PARTS = {
	"The Deadseat.pck": {
		files: ["The Deadseat.pck.001", "The Deadseat.pck.002"],
		type: "application/octet-stream",
	},
	"The Deadseat.wasm": {
		files: ["The Deadseat.wasm"],
		type: "application/wasm",
	},
};

const realFetch = window.fetch.bind(window);
function showParts(text) {
	const el = document.getElementById("status-parts");
	if (el) el.textContent = text;
}
window.fetch = async (input, init) => {
	const url = typeof input === "string" ? input : (input instanceof URL ? input.href : input.url);
	// decodeURIComponent so file names with spaces ("The Deadseat") still match
	const path = decodeURIComponent(new URL(url, document.baseURI).pathname);
	const name = Object.keys(PARTS).find((n) => path.endsWith("/" + n));
	if (!name) {
		return realFetch(input, init);
	}
	const { files, type } = PARTS[name];
	const dir = DATA_BASE;
	const chunks = new Array(files.length);
	let done = 0;
	showParts(`Game data: 0 / ${files.length} parts`);
	await Promise.all(files.map(async (f, i) => {
		const r = await realFetch(dir + encodeURIComponent(f));
		if (!r.ok) throw new Error("Failed to load " + f + " (HTTP " + r.status + ")");
		chunks[i] = await r.arrayBuffer();
		done++;
		showParts(`Game data: ${done} / ${files.length} parts`);
	}));
	showParts("");
	const blob = new Blob(chunks, { type });
	return new Response(blob, {
		status: 200,
		headers: { "Content-Type": type, "Content-Length": String(blob.size) },
	});
};
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"The Deadseat","experimentalVK":false,"fileSizes":{"The Deadseat.pck":191858224,"The Deadseat.wasm":49126045},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);

(function () {
	const INDETERMINATE_STATUS_STEP_MS = 100;
	const statusProgress = document.getElementById('status-progress');
	const statusProgressInner = document.getElementById('status-progress-inner');
	const statusIndeterminate = document.getElementById('status-indeterminate');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = 'hidden';

	let animationCallbacks = [];
	function animate(time) {
		animationCallbacks.forEach((callback) => callback(time));
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);

	function animateStatusIndeterminate(ms) {
		const i = Math.floor((ms / INDETERMINATE_STATUS_STEP_MS) % 8);
		if (statusIndeterminate.children[i].style.borderTopColor === '') {
			Array.prototype.slice.call(statusIndeterminate.children).forEach((child) => {
				child.style.borderTopColor = '';
			});
			statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		[statusProgress, statusIndeterminate, statusNotice].forEach((elem) => {
			elem.style.display = 'none';
		});
		animationCallbacks = animationCallbacks.filter(function (value) {
			return (value !== animateStatusIndeterminate);
		});
		switch (mode) {
		case 'progress':
			statusProgress.style.display = 'block';
			break;
		case 'indeterminate':
			statusIndeterminate.style.display = 'block';
			animationCallbacks.push(animateStatusIndeterminate);
			break;
		case 'notice':
			statusNotice.style.display = 'block';
			break;
		case 'hidden':
			break;
		default:
			throw new Error('Invalid status mode');
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		const msg = err.message || err;
		console.error(msg);
		setStatusNotice(msg);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures();
	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('indeterminate');
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					statusProgressInner.style.width = `${(current / total) * 100}%`;
					setStatusMode('progress');
					if (current === total) {
						// wait for progress bar animation
						setTimeout(() => {
							setStatusMode('indeterminate');
						}, 500);
					}
				} else {
					setStatusMode('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			initializing = false;
		}, displayFailureNotice);
	}
}());
		</script>
