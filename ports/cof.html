      let cache = null; try { cache = await caches.open("cof-" + "76e71af7e27dddf65c698115ee8b8df413956593".slice(0, 7)); } catch (e) {}

  };

      preRun: [m => { Object.assign(m.ENV, {"COF_EXE_PATH": "C:\\game\\cof.exe", "COF_ALWAYS_ACTIVE": "1", "COF_STEAM_APPID": "223710", "COF_GOLDSRC_CVARS": "cg_water=0;gl_screenblur=0;gl_posteffects=0;gl_bump=0;gl_noshaders=1", "COF_SYSTEM_PROXY_DLLS": "opengl32", "COF_GOLDSRC_PERSIST_SETTINGS": "1", "COF_WEB_BRAND": "cof", "COF_GOLDSRC_VERSION_LABEL": "port by 98corbins", "COF_PORT_ID": "cryoffear", "COF_ARGS": "-game cryoffear -gl -windowed -w 1280 -h 720 -nojoy +gl_noshaders 1 +gl_posteffects 0 +gl_bump 0 +cg_water 0 -insecure +sv_lan 1 -console +console 1"}); m.ENV.COF_FPS = String(cap); for (const [k, v] of q) if (k.startsWith('COF_')) m.ENV[k] = v; }],                                         
      print: s => {console.log(s);cofRecordLog('log',s);}, printErr: s => {

        if (/^(MISSING IMPORT:|FATAL:)/.test(s)) { status('Game stopped: ' + s); $('overlay').hidden=false;$('stage').hidden=true; if(document.pointerLockElement)document.exitPointerLock(); }
      },
      onAbort: reason => { status('Game stopped: ' + reason); $('overlay').hidden=false;$('stage').hidden=true; },
      onLog: s => cofRecordLog('log',s),
      onStatus: s => {status(s);cofRecordLog('status',s);},
      onFps: f => { $('fps').textContent = f.toFixed(0) + ' fps'; },
      onGameSize: (w, h) => { GAME_W = w; GAME_H = h; fit(); },
      onMouseCapture: gameMouseCapture, onCursorVisibility: gameCursorVisibility,
      onFirstFrame: () => { $('overlay').hidden=true;$('stage').hidden=false; canvas.focus(); },
    };
    window.cof = M; fit(); if (q.has('glahead')) M.glAhead = +q.get('glahead');
                                                                                                                            
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => console.log('[web] persistent storage: ' + ok)); } catch (e) {}

    if (GL_WORKER) try {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (probe) { M.glExtensions = probe.getSupportedExtensions().join(' '); const ax = probe.getExtension('EXT_texture_filter_anisotropic'); M.glMaxAniso = ax ? probe.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1; const le = probe.getExtension('WEBGL_lose_context'); if (le) le.loseContext(); }
      const off = canvas.transferControlToOffscreen(); transferred = true;
      M.glWorker = new Worker('gl_worker.js');
      M.glWorker.postMessage({ init: true, canvas: off, preserve: q.has('preserve') }, [off]);
    } catch (e) { status('This browser cannot run WebGL in a worker: ' + e); console.error(e); return; }
                                                                                                        
    M.gameBase = GAME_BASE;
    M.programList = (await fetch('programs.txt').then(r => r.ok ? r.text() : '').catch(() => '')) + (localStorage.getItem('cofProgs') || '');
    await startAudio(M);                                                                                    
    Cof(M).catch(e => { status('Failed to start: ' + e); console.error(e); });
    canvas.focus();
  };
  if (q.has('autostart')) $('play').onclick();
})();
