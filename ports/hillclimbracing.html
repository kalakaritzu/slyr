<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill Climb Racing</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #07080a; --panel: rgba(12, 14, 18, 0.86); --ink: #e8ecf1; --dim: #8b95a3; --accent: #f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; background: #000; width: 100vw; height: 100vh; object-fit: contain; outline: none; }   /* letterboxed: aspect ratio preserved, black bars fill the rest */
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #000; transition: opacity .4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(380px, calc(100vw - 48px)); text-align: center; }
  #load-times { display: grid; gap: 20px; text-align: left; font: 13px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .timing-row { display: flex; justify-content: space-between; gap: 18px; margin-bottom: 7px; }
  .timing-row span:last-child { color: var(--dim); }
  .loading-track { height: 5px; overflow: hidden; background: #252525; border-radius: 3px; }
  .loading-fill { height: 100%; width: 35%; background: var(--accent); border-radius: inherit; animation: loading 1.4s ease-in-out infinite alternate; }
  .loading-fill.done { width: 100%; animation: none; }
  @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(285%); } }
  #status { margin-top: 18px; min-height: 1.4em; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* bottom centre, between the game's gauges (its own buttons sit in the top corners); shown while hovered */
  #hud { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; opacity: 0; transition: opacity .3s; padding: 6px; }
  #hud:hover { opacity: 1; }
  #hud button { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid rgba(255,255,255,.1); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  #fps { font: 12px ui-monospace, monospace; color: var(--dim); background: var(--panel); padding: 4px 8px; border-radius: 7px; display: none; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); background: var(--panel); padding: 5px 12px; border-radius: 8px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #hint.show { opacity: 1; }
  #bigload { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #07080a; color: #fff; font: 18px system-ui, sans-serif; text-align: center; padding: 0 20px; }
  #bigload .bar { width: min(340px, 80vw); height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #bigload .fill { width: 0%; height: 100%; background: #f2c14e; transition: width .2s linear; }
  #bigload .detail { font-size: 13px; color: rgba(255,255,255,.6); min-height: 1.2em; }
  #bigload button { display: none; margin-top: 4px; padding: 8px 18px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 999px; cursor: pointer; font: 14px system-ui, sans-serif; }
</style></head>
<body>
<div id="stage"><canvas id="canvas" width="800" height="600" tabindex="0"></canvas></div>
<div id="hud"><span id="fps"></span><button id="bsound">Sound: on</button><button id="bfps" title="F8">FPS</button><button id="bcap" title="Frame rate cap">Cap: 60</button><button id="bvsync">Vsync: off</button><button id="bfull" title="F11">Fullscreen</button></div>
<div id="overlay"><div class="card">
  <div id="load-times" aria-live="polite">
    <div><div class="timing-row"><span>WASM</span><span id="wasm-time">Loading…</span></div><div class="loading-track"><div class="loading-fill" id="wasm-bar"></div></div></div>
    <div><div class="timing-row"><span>Data</span><span id="data-time">Loading…</span></div><div class="loading-track"><div class="loading-fill" id="data-bar"></div></div></div>
    <div><div class="timing-row"><span>BIN</span><span id="bin-time">Loading…</span></div><div class="loading-track"><div class="loading-fill" id="bin-bar"></div></div></div>
  </div>
  <div id="status"></div>
</div></div>
<div id="bigload"><div class="text">Downloading the game...</div><div class="bar"><div class="fill"></div></div><div class="detail"></div><button type="button" onclick="location.reload()">Try again</button></div>
<script>
// The game's 186 MB lives in NotRexed/HillClimbRacingPort (pinned to one version) as ~11-17 MB pieces. Every piece is size-checked
// and retried, and finished pieces are kept in the browser's cache. The game asks for hcr.wasm, hcr.data and image.bin as whole
// files, so those requests are answered from the joined pieces (including byte ranges, which the game uses to read its data).
(function () {
  const BASE = "https://raw.githubusercontent.com/NotRexed/HillClimbRacingPort/43c3f7537369a4f89d8c81f53f7bfc472d738459/";
  const FILES = {
    "hcr.wasm": { type: "application/wasm", parts: [["hcr.wasm.part1", 15221492], ["hcr.wasm.part2", 15221492], ["hcr.wasm.part3", 15221492], ["hcr.wasm.part4", 15221489]] },
    "hcr.data": { type: "application/octet-stream", parts: [["hcr.data.part1", 17201818], ["hcr.data.part2", 17201818], ["hcr.data.part3", 17201818], ["hcr.data.part4", 17201818], ["hcr.data.part5", 17201818], ["hcr.data.part6", 17201817]] },
    "image.bin": { type: "application/octet-stream", parts: [["image.bin.part1", 11042816], ["image.bin.part2", 11042816]] }
  };
  const TOTAL = Object.values(FILES).reduce((a, f) => a + f.parts.reduce((x, p) => x + p[1], 0), 0);
  const realFetch = window.fetch.bind(window);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const root = document.getElementById("bigload"), q = s => root.querySelector(s);
  let done = 0;
  function shown() {
    q(".fill").style.width = Math.min(100, done / TOTAL * 100).toFixed(1) + "%";
    q(".detail").textContent = Math.round(done / 1048576) + " MB of " + Math.round(TOTAL / 1048576) + " MB";
  }
  async function getPart(name, expected) {
    let cache = null;
    try { cache = await caches.open("hcr-" + "43c3f7537369a4f89d8c81f53f7bfc472d738459".slice(0, 7)); } catch (e) {}
    if (cache) { try { const hit = await cache.match("/__hcr/" + name); if (hit) { const b = await hit.blob(); if (b.size === expected) return b; } } catch (e) {} }
    for (let attempt = 1; attempt <= 4; attempt++) {
      try {
        const r = await realFetch(BASE + name + (attempt > 2 ? "?t=" + Date.now() : ""));
        if (r.ok) {
          const b = await r.blob();
          if (b.size === expected) { if (cache) { try { await cache.put("/__hcr/" + name, new Response(b)); } catch (e) {} } return b; }
        }
      } catch (e) { /* try again */ }
      await sleep(400 * attempt);
    }
    throw new Error("Could not download " + name);
  }
  const blobs = {};
  const ready = (async () => {
    try {
      for (const [name, f] of Object.entries(FILES)) {
        const list = [];
        for (const [part, size] of f.parts) { list.push(await getPart(part, size)); done += size; shown(); }
        blobs[name] = new Blob(list, { type: f.type });         // a Blob of Blobs can be backed by disk
      }
      root.remove();
    } catch (err) {
      q(".text").textContent = "Game loading failed: " + err.message;
      q("button").style.display = "block";
      throw err;
    }
  })();
  ready.catch(() => {});
  window.fetch = async function (input, init) {
    const url = typeof input === "string" ? input : (input instanceof URL ? input.href : (input && input.url)) || "";
    const name = url.split("?")[0].split("/").pop();
    if (!FILES[name]) return realFetch(input, init);
    await ready;
    const blob = blobs[name], type = FILES[name].type;
    const range = init && init.headers && (init.headers.Range || init.headers.range || (init.headers.get && init.headers.get("Range")));
    const m = range && /bytes=(\d*)-(\d*)/.exec(range);
    if (m) {
      const a = m[1] ? +m[1] : 0, b = m[2] ? Math.min(+m[2], blob.size - 1) : blob.size - 1;
      return new Response(blob.slice(a, b + 1), { status: 206, headers: { "Content-Type": type, "Content-Range": "bytes " + a + "-" + b + "/" + blob.size, "Content-Length": String(b - a + 1), "Accept-Ranges": "bytes" } });
    }
    return new Response(blob, { status: 200, headers: { "Content-Type": type, "Content-Length": String(blob.size), "Accept-Ranges": "bytes" } });
  };
  // the game also reads its data with synchronous requests (XMLHttpRequest): those get the joined blob too
  const xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    const name = String(url).split("?")[0].split("/").pop();
    if (FILES[name] && blobs[name]) { arguments[1] = URL.createObjectURL(blobs[name]); }
    return xo.apply(this, arguments);
  };
})();
</script>
<script src="hillclimbracing/hcr.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), status = s => { $('status').textContent = s; };
  const q = new URLSearchParams(location.search);
  // where hcr.data is served from: '' = next to this page, or a CDN folder URL ending in '/'
  // (`python build.py pack hcr` writes the game files into one hcr.data)
  const GAME_BASE = '';
  // settings saved before the port's rename (saVsync, saProgs) carry over once
  try { for (const k of ['Vsync', 'Progs']) { const v = localStorage.getItem('sa' + k); if (v !== null) { if (localStorage.getItem('hcr' + k) === null) localStorage.setItem('hcr' + k, v); localStorage.removeItem('sa' + k); } } } catch (e) {}
  const assetTimings = new Map();
  const timingIds = { 'hcr.wasm': 'wasm-time', 'hcr.data': 'data-time', 'image.bin': 'bin-time' };
  const recordTiming = entry => {
    const name = new URL(entry.name).pathname.split('/').pop();
    const id = timingIds[name];
    if (!id) return;
    const stat = assetTimings.get(name) || { ms: 0, requests: 0 };
    stat.ms += entry.duration;
    stat.requests++;
    assetTimings.set(name, stat);
    $(id).textContent = (stat.ms / 1000).toFixed(2) + ' s' + (stat.requests > 1 ? ` (${stat.requests} requests)` : '');
    $(id.replace('-time', '-bar')).classList.add('done');
  };
  new PerformanceObserver(list => list.getEntries().forEach(recordTiming))
    .observe({ type: 'resource', buffered: true });
  const supported = 'Suspending' in WebAssembly;
  if (!supported) status('This browser lacks WebAssembly JavaScript Promise Integration: use Chrome or Edge 137 or newer.');
  let GAME_W = 1280, GAME_H = 720;              // the game's back buffer (mouse coordinates are in it; follows its video mode)

  // physical key (KeyboardEvent.code) -> [virtual key, scan code, extended]
  const K = {};
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((ch, i) => { K['Key' + ch] = [65 + i, [0x1E,0x30,0x2E,0x20,0x12,0x21,0x22,0x23,0x17,0x24,0x25,0x26,0x32,0x31,0x18,0x19,0x10,0x13,0x1F,0x14,0x16,0x2F,0x11,0x2D,0x15,0x2C][i], 0]; });
  for (let d = 0; d <= 9; d++) K['Digit' + d] = [48 + d, d === 0 ? 0x0B : d + 1, 0];
  Object.assign(K, { Escape: [0x1B, 0x01, 0], Minus: [0xBD, 0x0C, 0], Equal: [0xBB, 0x0D, 0], Backspace: [0x08, 0x0E, 0], Tab: [0x09, 0x0F, 0], BracketLeft: [0xDB, 0x1A, 0], BracketRight: [0xDD, 0x1B, 0],
    Enter: [0x0D, 0x1C, 0], ControlLeft: [0x11, 0x1D, 0], Semicolon: [0xBA, 0x27, 0], Quote: [0xDE, 0x28, 0], Backquote: [0xC0, 0x29, 0], ShiftLeft: [0x10, 0x2A, 0], Backslash: [0xDC, 0x2B, 0],
    Comma: [0xBC, 0x33, 0], Period: [0xBE, 0x34, 0], Slash: [0xBF, 0x35, 0], ShiftRight: [0x10, 0x36, 0], NumpadMultiply: [0x6A, 0x37, 0], AltLeft: [0x12, 0x38, 0], Space: [0x20, 0x39, 0],
    CapsLock: [0x14, 0x3A, 0], F1: [0x70, 0x3B, 0], F2: [0x71, 0x3C, 0], F3: [0x72, 0x3D, 0], F4: [0x73, 0x3E, 0], F5: [0x74, 0x3F, 0], F6: [0x75, 0x40, 0], F7: [0x76, 0x41, 0], F10: [0x79, 0x44, 0],
    F12: [0x7B, 0x58, 0], Numpad7: [0x67, 0x47, 0], Numpad8: [0x68, 0x48, 0], Numpad9: [0x69, 0x49, 0], NumpadSubtract: [0x6D, 0x4A, 0], Numpad4: [0x64, 0x4B, 0], Numpad5: [0x65, 0x4C, 0],
    Numpad6: [0x66, 0x4D, 0], NumpadAdd: [0x6B, 0x4E, 0], Numpad1: [0x61, 0x4F, 0], Numpad2: [0x62, 0x50, 0], Numpad3: [0x63, 0x51, 0], Numpad0: [0x60, 0x52, 0], NumpadDecimal: [0x6E, 0x53, 0],
    NumpadEnter: [0x0D, 0x1C, 1], ControlRight: [0x11, 0x1D, 1], AltRight: [0x12, 0x38, 1], ArrowUp: [0x26, 0x48, 1], ArrowLeft: [0x25, 0x4B, 1], ArrowRight: [0x27, 0x4D, 1], ArrowDown: [0x28, 0x50, 1],
    Insert: [0x2D, 0x52, 1], Delete: [0x2E, 0x53, 1], Home: [0x24, 0x47, 1], End: [0x23, 0x4F, 1], PageUp: [0x21, 0x49, 1], PageDown: [0x22, 0x51, 1] });

  let M = null, started = false;
  // the canvas holds exactly the game's frame (it draws with a GAME_W x GAME_H viewport into the default framebuffer);
  // CSS stretches it over the whole window, and pointer positions are scaled back (pos)
  let transferred = false;
  const fit = () => { const w = GAME_W, h = GAME_H;
    if (M) { M.canvasW = w; M.canvasH = h; } if (!transferred && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; } };
  addEventListener('resize', fit); fit();
  $('bfps').onclick = () => { const f = $('fps'); f.style.display = f.style.display === 'inline' ? 'none' : 'inline'; };
  $('bfull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  const setVsync = on => { if (M) M.vsync = on; localStorage.setItem('hcrVsync', on ? '1' : '0'); $('bvsync').textContent = 'Vsync: ' + (on ? 'on' : 'off'); };
  $('bvsync').onclick = () => { setVsync(localStorage.getItem('hcrVsync') !== '1'); alert('Reload the page to apply.'); };
  setVsync(localStorage.getItem('hcrVsync') === '1');
  // frame-rate cap (the game renders as fast as it is let; its animation follows the frame time)
  const CAPS = [60, 120, 0, 30], capName = c => c ? String(c) : 'max';
  let cap = +(q.get('HCR_FPS') ?? localStorage.getItem('hcrCap') ?? 60); if (!CAPS.includes(cap)) cap = 60;
  const showCap = () => { $('bcap').textContent = 'Cap: ' + capName(cap); };
  $('bcap').onclick = () => { cap = CAPS[(CAPS.indexOf(cap) + 1) % CAPS.length]; localStorage.setItem('hcrCap', String(cap)); showCap(); if (M && M._hcr_ev_fps) M._hcr_ev_fps(cap); };
  showCap();
  for (const b of document.querySelectorAll('#hud button')) { b.tabIndex = -1; b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', () => { b.blur(); canvas.focus(); }); }

  // ---- input -> guest window messages / DirectInput state
  const ev = (name, ...a) => { if (M && M['_' + name]) M['_' + name](...a); };
  // with object-fit:contain the rendered area is smaller than the element; compute the actual content rect
  const pos = e => { const r = canvas.getBoundingClientRect();
    const scale = Math.min(r.width / GAME_W, r.height / GAME_H);
    const cw = GAME_W * scale, ch = GAME_H * scale;
    const ox = r.left + (r.width - cw) / 2, oy = r.top + (r.height - ch) / 2;
    return [Math.round((e.clientX - ox) / scale), Math.round((e.clientY - oy) / scale)]; };
  addEventListener('keydown', e => {
    if (!started) return;
    if (e.code === 'F8') { $('bfps').onclick(); e.preventDefault(); return; }
    if (e.code === 'F11') { $('bfull').onclick(); e.preventDefault(); return; }
    const k = K[e.code]; if (!k) return;
    ev('hcr_ev_key', 1, k[0], k[1], (e.repeat ? 1 : 0) | (k[2] ? 2 : 0));
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey) ev('hcr_ev_char', e.key.charCodeAt(0));
    else if (e.code === 'Enter' || e.code === 'Backspace' || e.code === 'Escape') ev('hcr_ev_char', k[0]);
    e.preventDefault();
  });
  addEventListener('keyup', e => { if (!started) return; const k = K[e.code]; if (!k) return; ev('hcr_ev_key', 0, k[0], k[1], k[2] ? 2 : 0); e.preventDefault(); });
  // the mouse is the game's pointer 1; touch and pen contacts are pointers of their own (hold gas with one finger, tap
  // with another)
  let mouseDown = false;
  const tid = e => (e.pointerId % 1000000) + 2;
  canvas.addEventListener('pointerdown', e => {
    canvas.focus(); e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { mouseDown = true; ev('hcr_ev_mouse', 0, x, y, 0, 0); ev('hcr_ev_mouse', 1, x, y, e.button, 0); }
    else ev('hcr_ev_touch', 0, tid(e), x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') ev('hcr_ev_mouse', 0, x, y, 0, 0); else ev('hcr_ev_touch', 1, tid(e), x, y);
  });
  const up = e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { if (mouseDown) { mouseDown = false; ev('hcr_ev_mouse', 2, x, y, e.button, 0); } }
    else ev('hcr_ev_touch', 2, tid(e), x, y);
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('focus', () => ev('hcr_ev_focus', 1)); addEventListener('blur', () => ev('hcr_ev_focus', 0));
  canvas.addEventListener('webglcontextlost', () => { status('The graphics context was lost (GPU reset). Reload the page to continue.'); $('overlay').classList.remove('hidden'); });

  // ---- audio: an AudioWorklet playing the DirectSound mix (jitter buffer; drops backlog beyond 200 ms)
  const WORKLET = `class HCROut extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.off = 0; this.queued = 0;
      this.port.onmessage = e => { this.q.push(e.data); this.queued += e.data.length / 2;
        while (this.queued > sampleRate * 0.2 && this.q.length > 1) { const b = this.q.shift(); this.queued -= b.length / 2 - this.off; this.off = 0; } }; }
    process(inputs, outputs) { const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length; let i = 0;
      while (i < n && this.q.length) { const b = this.q[0], frames = b.length / 2, take = Math.min(n - i, frames - this.off);
        for (let k = 0; k < take; k++) { L[i + k] = b[(this.off + k) * 2]; R[i + k] = b[(this.off + k) * 2 + 1]; }
        i += take; this.off += take; this.queued -= take; if (this.off >= frames) { this.q.shift(); this.off = 0; } }
      for (; i < n; i++) { L[i] = 0; R[i] = 0; }
      return true; } }
  registerProcessor('hcr-out', HCROut);`;
  async function startAudio(M) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
      const node = new AudioWorkletNode(ctx, 'hcr-out', { numberOfInputs: 0, outputChannelCount: [2] });
      node.connect(ctx.destination); M.audioContext = ctx; M.audioNode = node;
      const resumeAudio = () => { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); };
      addEventListener('pointerdown', resumeAudio, { once: true });
      addEventListener('keydown', resumeAudio, { once: true });
      $('bsound').onclick = () => { const on = ctx.state !== 'running'; if (on) ctx.resume(); else ctx.suspend(); $('bsound').textContent = on ? 'Sound: on' : 'Sound: off'; };
    } catch (e) { console.warn('[audio] unavailable:', e); $('bsound').textContent = 'Sound: n/a'; }
  }

  async function startGame() {
    if (started) return; started = true;
    status('Loading…');
    M = {
      canvas, vsync: localStorage.getItem('hcrVsync') === '1' || q.has('vsync'),
      preRun: [m => { m.ENV.HCR_FPS = String(cap); for (const [k, v] of q) if (k.startsWith('HCR_')) m.ENV[k] = v; }],   // debug switches, e.g. ?HCR_INPUT=...
      print: s => console.log(s), printErr: s => console.error(s),
      onStatus: s => status(s),
      onFps: f => { $('fps').textContent = f.toFixed(0) + ' fps'; },
      onGameSize: (w, h) => { GAME_W = w; GAME_H = h; fit(); },
      onFirstFrame: () => { $('overlay').classList.add('hidden'); canvas.focus(); },
    };
    window.hcr = M; fit(); if (q.has('glahead')) M.glAhead = +q.get('glahead');
    // saves and settings live in IndexedDB: ask for persistent storage so the browser doesn't evict them when disk runs low
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => console.log('[web] persistent storage: ' + ok)); } catch (e) {}
    // graphics on a worker thread: probe the GPU's WebGL2 extensions here, then hand the canvas to rt/web/gl_worker.js
    const GL_WORKER = false;   // build.py --gl direct flips this
    if (GL_WORKER) try {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (probe) { M.glExtensions = probe.getSupportedExtensions().join(' '); const ax = probe.getExtension('EXT_texture_filter_anisotropic'); M.glMaxAniso = ax ? probe.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1; const le = probe.getExtension('WEBGL_lose_context'); if (le) le.loseContext(); }
      const off = canvas.transferControlToOffscreen(); transferred = true;
      M.glWorker = new Worker('hillclimbracing/gl_worker.js');
      M.glWorker.postMessage({ init: true, canvas: off, preserve: q.has('preserve') }, [off]);
    } catch (e) { status('This browser cannot run WebGL in a worker: ' + e); console.error(e); return; }
    // shader programs to compile during loading (recorded play sessions + ones this browser met before)
    M.gameBase = GAME_BASE;
    M.programList = (await fetch('hillclimbracing/programs.txt').then(r => r.ok ? r.text() : '').catch(() => '')) + (localStorage.getItem('hcrProgs') || '');
    await startAudio(M);                    // audio resumes on the first user gesture
    HCRWasm(M).catch(e => { status('Failed to start: ' + e); console.error(e); });
    canvas.focus();
  }
  if (supported) startGame();
})();
</script>
