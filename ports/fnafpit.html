<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Five Nights at Freddy's: Into the Pit</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #unity-canvas, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff; font: 18px Arial, sans-serif; text-align: center; padding: 0 20px; }
  #loading .bar { width: min(340px, 80vw); height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #loading .fill { width: 0%; height: 100%; background: #f2c200; transition: width .2s linear; }
  #loading .detail { font-size: 13px; color: rgba(255,255,255,.6); min-height: 1.2em; }
  #loading button { display: none; margin-top: 4px; padding: 8px 18px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 999px; cursor: pointer; font: 14px Arial, sans-serif; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div class="text">Downloading the game...</div><div class="bar"><div class="fill"></div></div><div class="detail"></div><button type="button" onclick="location.reload()">Try again</button></div>
<script>
// The game's data (about 605 MB) lives in web-ports/fnaf-into-the-pit (pinned to one version). Every piece is size-checked and retried,
// and finished pieces are kept in the browser's cache so the next visit does not download them again.
const REPO = "web-ports/fnaf-into-the-pit", REF = "df6e074be181d4d2fb419241a25138bb8acbb928", CACHE = "fnafpit";
const BASE = `https://raw.githubusercontent.com/${REPO}/${REF}/`;
const FILES = [{"key": "data", "type": "application/octet-stream", "parts": [["Build/INTOTHEPIT.data.part1", 20866662], ["Build/INTOTHEPIT.data.part2", 20866662], ["Build/INTOTHEPIT.data.part3", 20866662], ["Build/INTOTHEPIT.data.part4", 20866662], ["Build/INTOTHEPIT.data.part5", 20866662], ["Build/INTOTHEPIT.data.part6", 20866662], ["Build/INTOTHEPIT.data.part7", 20866662], ["Build/INTOTHEPIT.data.part8", 20866662], ["Build/INTOTHEPIT.data.part9", 20866662], ["Build/INTOTHEPIT.data.part10", 20866662], ["Build/INTOTHEPIT.data.part11", 20866662], ["Build/INTOTHEPIT.data.part12", 20866662], ["Build/INTOTHEPIT.data.part13", 20866662], ["Build/INTOTHEPIT.data.part14", 20866662], ["Build/INTOTHEPIT.data.part15", 20866662], ["Build/INTOTHEPIT.data.part16", 20866662], ["Build/INTOTHEPIT.data.part17", 20866662], ["Build/INTOTHEPIT.data.part18", 20866662], ["Build/INTOTHEPIT.data.part19", 20866662], ["Build/INTOTHEPIT.data.part20", 20866662], ["Build/INTOTHEPIT.data.part21", 20866662], ["Build/INTOTHEPIT.data.part22", 20866662], ["Build/INTOTHEPIT.data.part23", 20866662], ["Build/INTOTHEPIT.data.part24", 20866662], ["Build/INTOTHEPIT.data.part25", 20866662], ["Build/INTOTHEPIT.data.part26", 9013795]]}, {"key": "code", "type": "application/wasm", "parts": [["Build/INTOTHEPIT.wasm.part1", 20866662], ["Build/INTOTHEPIT.wasm.part2", 20866662], ["Build/INTOTHEPIT.wasm.part3", 20866662], ["Build/INTOTHEPIT.wasm.part4", 20866662], ["Build/INTOTHEPIT.wasm.part5", 20495558]]}];

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TOTAL = FILES.reduce((a, f) => a + f.parts.reduce((x, p) => x + p[1], 0), 0);
let done = 0;
function shown() {
  $("#loading .fill").style.width = Math.min(100, done / TOTAL * 100).toFixed(1) + "%";
  $("#loading .detail").textContent = Math.round(done / 1048576) + " MB of " + Math.round(TOTAL / 1048576) + " MB";
}
async function getPart(path, expected) {
  let cache = null;
  try { cache = await caches.open(CACHE + "-" + REF.slice(0, 7)); } catch (e) {}
  if (cache) {
    try { const hit = await cache.match("/__" + CACHE + "/" + path); if (hit) { const b = await hit.blob(); if (b.size === expected) return b; } } catch (e) {}
  }
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      const r = await fetch(BASE + path + (attempt > 2 ? "?t=" + Date.now() : ""));
      if (r.ok) {
        const b = await r.blob();
        if (b.size === expected) {
          if (cache) { try { await cache.put("/__" + CACHE + "/" + path, new Response(b)); } catch (e) {} }
          return b;
        }
      }
    } catch (e) { /* try again */ }
    await sleep(400 * attempt);
  }
  throw new Error("Could not download " + path);
}
async function joined(f) {
  const blobs = [];
  for (const [path, size] of f.parts) { blobs.push(await getPart(path, size)); done += size; shown(); }
  // A Blob of Blobs can be backed by disk, so memory stays near one piece
  return URL.createObjectURL(new Blob(blobs, { type: f.type }));
}
function fail(err) {
  $("#loading .text").textContent = "Game loading failed: " + (err && err.message || err);
  $("#loading button").style.display = "block";
  console.error(err);
}


async function start() {
  try {
    const urls = {};
    for (const f of FILES) urls[f.key] = await joined(f);
    const loader = document.createElement("script");
    loader.src = "fnafpit/Build/INTOTHEPIT.loader.js";
    await new Promise((res, rej) => { loader.onload = res; loader.onerror = () => rej(new Error("Could not load the game launcher.")); document.body.appendChild(loader); });
    $("#loading .text").textContent = "Starting the game...";
    window.alert = m => console.warn("[unity]", m);
    window.unityInstance = await createUnityInstance($("#unity-canvas"), {
      dataUrl: urls.data,
      frameworkUrl: "fnafpit/Build/INTOTHEPIT.framework.js",
      codeUrl: urls.code,
      streamingAssetsUrl: BASE + "StreamingAssets",
      companyName: "Mega Cat Studios",
      productName: "Five Nights at Freddy's Into the Pit",
      productVersion: "Release 1.0.11.7",
      showBanner: (msg, type) => console.warn("[unity " + (type || "info") + "]", msg)
    }, p => { $("#loading .fill").style.width = (100 * p).toFixed(0) + "%"; });
    $("#loading").remove();
  } catch (err) { fail(err); }
}
start();
</script>
</body>
</html>
