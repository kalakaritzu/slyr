<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Feed The Pit</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#bigload { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff; font: 18px Arial, sans-serif; text-align: center; padding: 0 20px; }
		#bigload .bar { width: min(340px, 80vw); height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
		#bigload .fill { width: 0%; height: 100%; background: #e8232b; transition: width .2s linear; }
		#bigload .detail { font-size: 13px; color: rgba(255,255,255,.6); min-height: 1.2em; }
		#bigload button { display: none; margin-top: 4px; padding: 8px 18px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 999px; cursor: pointer; font: 14px Arial, sans-serif; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="feedthepit/feedthepit.icon.png" />
<link rel="apple-touch-icon" href="feedthepit/feedthepit.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="bigload"><div class="text">Downloading the game...</div><div class="bar"><div class="fill"></div></div><div class="detail"></div><button type="button" onclick="location.reload()">Try again</button></div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="feedthepit/feedthepit.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="feedthepit/feedthepit.js"></script>
		<script>
// The game files live in idkdl/feedthepit-src (pinned to one version) as ~19 MB pieces. Every piece is size-checked,
// a bad or refused download is retried on another copy, and finished pieces are kept in the browser's cache so the
// next visit does not download them again.
const BIG_REPO = "idkdl/feedthepit-src", BIG_REF = "237d3ff12825328cc60b9c24fc778dbe8691f4db";
const BIG_BASES = [
	`https://raw.githubusercontent.com/${BIG_REPO}/${BIG_REF}/`,
	`https://cdn.jsdelivr.net/gh/${BIG_REPO}@${BIG_REF}/`
];
const BIG_FILES = [
	{ url: "feedthepit/feedthepit.wasm", name: "feedthepit.wasm", type: "application/wasm", parts: [19922944, 17979194] },
	{ url: "feedthepit/feedthepit.pck", name: "feedthepit.pck", type: "application/octet-stream",
	  parts: Array.from({ length: 31 }, (_, i) => i < 30 ? 19922944 : 14329096) }
];
const BIG_TOTAL = BIG_FILES.reduce((a, f) => a + f.parts.reduce((x, y) => x + y, 0), 0);
const bigBlobs = Object.create(null);
(function () {
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const u = typeof input === "string" ? input : (input instanceof URL ? input.href : (input && input.url));
		if (u) {
			for (const f of BIG_FILES) {
				if (u.split("?")[0].endsWith(f.url) && bigBlobs[f.url]) {
					return Promise.resolve(new Response(bigBlobs[f.url], { status: 200, headers: { "Content-Type": f.type } }));
				}
			}
		}
		return realFetch(input, init);
	};
	const root = document.getElementById("bigload");
	const q = s => root.querySelector(s);
	const sleep = ms => new Promise(r => setTimeout(r, ms));
	let done = 0;
	function shown() {
		q(".fill").style.width = Math.min(100, done / BIG_TOTAL * 100).toFixed(1) + "%";
		q(".detail").textContent = Math.round(done / 1048576) + " MB of " + Math.round(BIG_TOTAL / 1048576) + " MB";
	}
	async function getPart(name, expected) {
		let cache = null;
		try { cache = await caches.open("feedthepit-" + BIG_REF.slice(0, 7)); } catch (e) {}
		if (cache) {
			try {
				const hit = await cache.match("/__ftp/" + name);
				if (hit) { const b = await hit.blob(); if (b.size === expected) return b; }
			} catch (e) {}
		}
		for (const base of BIG_BASES) {
			for (let attempt = 1; attempt <= 2; attempt++) {
				try {
					const r = await realFetch(base + name + (attempt > 1 ? "?t=" + Date.now() : ""));
					if (r.ok) {
						const b = await r.blob();
						if (b.size === expected) {
							if (cache) { try { await cache.put("/__ftp/" + name, new Response(b)); } catch (e) {} }
							return b;
						}
					}
				} catch (e) { /* try the next copy */ }
				await sleep(300 * attempt);
			}
		}
		throw new Error("Could not download " + name);
	}
	window.loadBig = async function () {
		try {
			for (const f of BIG_FILES) {
				const blobs = [];
				for (let i = 0; i < f.parts.length; i++) {
					const b = await getPart(f.name + ".part" + (i + 1), f.parts[i]);
					blobs.push(b); done += f.parts[i]; shown();
				}
				bigBlobs[f.url] = new Blob(blobs, { type: f.type });
			}
			root.remove();
		} catch (err) {
			q(".text").textContent = "Game loading failed: " + err.message;
			q("button").style.display = "block";
			throw err;
		}
	};
})();
		</script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"feedthepit/feedthepit","experimentalVK":false,"fileSizes":{"feedthepit.pck":612017416,"feedthepit.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		loadBig().then(() => engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
