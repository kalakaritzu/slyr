<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>POSTAL</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #unity-canvas, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff; font: 18px Arial, sans-serif; text-align: center; padding: 0 20px; }
  #loading .bar { width: min(340px, 80vw); height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #loading .fill { width: 0%; height: 100%; background: #d22; transition: width .2s linear; }
  #loading .detail { font-size: 13px; color: rgba(255,255,255,.6); min-height: 1.2em; }
  #loading button { display: none; margin-top: 4px; padding: 8px 18px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 999px; cursor: pointer; font: 14px Arial, sans-serif; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()" onclick="requestPointerLock()"></canvas>
<div id="loading"><div class="text">Downloading the game...</div><div class="bar"><div class="fill"></div></div><div class="detail"></div><button type="button" onclick="location.reload()">Try again</button></div>
<script>
// The game's data (about 465 MB) lives in Stinkalistic/UGS (pinned to one version). Every piece is size-checked and retried,
// and finished pieces are kept in the browser's cache so the next visit does not download them again.
const REPO = "Stinkalistic/UGS", REF = "bc13cc7651ca3e238d734ba1e37964c3b8607071", CACHE = "postal";
const BASE = `https://raw.githubusercontent.com/${REPO}/${REF}/`;
const FILES = [{"key": "data", "type": "application/octet-stream", "parts": [["MISC/postal/index.data.part1", 20971520], ["MISC/postal/index.data.part2", 20971520], ["MISC/postal/index.data.part3", 20971520], ["MISC/postal/index.data.part4", 20971520], ["MISC/postal/index.data.part5", 20971520], ["MISC/postal/index.data.part6", 20971520], ["MISC/postal/index.data.part7", 20971520], ["MISC/postal/index.data.part8", 20971520], ["MISC/postal/index.data.part9", 20971520], ["MISC/postal/index.data.part10", 20971520], ["MISC/postal/index.data.part11", 20971520], ["MISC/postal/index.data.part12", 20971520], ["MISC/postal/index.data.part13", 20971520], ["MISC/postal/index.data.part14", 20971520], ["MISC/postal/index.data.part15", 20971520], ["MISC/postal/index.data.part16", 20971520], ["MISC/postal/index.data.part17", 20971520], ["MISC/postal/index.data.part18", 20971520], ["MISC/postal/index.data.part19", 20971520], ["MISC/postal/index.data.part20", 20971520], ["MISC/postal/index.data.part21", 20971520], ["MISC/postal/index.data.part22", 20971520], ["MISC/postal/index.data.part23", 20971520], ["MISC/postal/index.data.part24", 5559238]]}];

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TOTAL = FILES.reduce((a, f) => a + f.parts.reduce((x, p) => x + p[1], 0), 0);
let done = 0;
function shown() {
  $("#loading .fill").style.width = Math.min(100, done / TOTAL * 100).toFixed(1) + "%";
  $("#loading .detail").textContent = Math.round(done / 1048576) + " MB of " + Math.round(TOTAL / 1048576) + " MB";
}
async function getPart(path, expected) {
  let cache = null;
  try { cache = await caches.open(CACHE + "-" + REF.slice(0, 7)); } catch (e) {}
  if (cache) {
    try { const hit = await cache.match("/__" + CACHE + "/" + path); if (hit) { const b = await hit.blob(); if (b.size === expected) return b; } } catch (e) {}
  }
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      const r = await fetch(BASE + path + (attempt > 2 ? "?t=" + Date.now() : ""));
      if (r.ok) {
        const b = await r.blob();
        if (b.size === expected) {
          if (cache) { try { await cache.put("/__" + CACHE + "/" + path, new Response(b)); } catch (e) {} }
          return b;
        }
      }
    } catch (e) { /* try again */ }
    await sleep(400 * attempt);
  }
  throw new Error("Could not download " + path);
}
async function joined(f) {
  const blobs = [];
  for (const [path, size] of f.parts) { blobs.push(await getPart(path, size)); done += size; shown(); }
  // A Blob of Blobs can be backed by disk, so memory stays near one piece
  return URL.createObjectURL(new Blob(blobs, { type: f.type }));
}
function fail(err) {
  $("#loading .text").textContent = "Game loading failed: " + (err && err.message || err);
  $("#loading button").style.display = "block";
  console.error(err);
}


let dataUrl = null;
const isData = u => String(u).split("?")[0].split("/").pop() === "index.data";
const xo = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function (m, u) { if (dataUrl && isData(u)) arguments[1] = dataUrl; return xo.apply(this, arguments); };
const realFetch = window.fetch.bind(window);
window.fetch = function (input, init) {
  const u = typeof input === "string" ? input : (input instanceof URL ? input.href : (input && input.url));
  if (dataUrl && u && isData(u)) return realFetch(dataUrl, init);
  return realFetch(input, init);
};
async function start() {
  try {
    dataUrl = await joined(FILES[0]);
    $("#loading .text").textContent = "Starting the game...";
    window.Module = {
      canvas: document.getElementById("canvas"),
      locateFile: p => isData(p) ? dataUrl : "postal/" + p,
      setStatus: t => { if (t) $("#loading .detail") && ($("#loading .detail").textContent = t); },
      monitorRunDependencies: left => { if (left === 0) { const l = $("#loading"); if (l) l.remove(); } }
    };
    const s = document.createElement("script");
    s.src = "postal/index.js";
    s.onerror = () => fail(new Error("Could not load the game."));
    document.body.appendChild(s);
  } catch (err) { fail(err); }
}
start();
</script>
</body>
</html>
