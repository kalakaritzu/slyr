<script>
/* The CDN sometimes refuses big files (403/429) or answers with a tiny error page. When that happens the same file is
   fetched again from GitHub's own servers, and the other way round. */
(function(){
  var of=window.fetch.bind(window);
  var jd=/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^\/@]+)\/([^\/@]+)@([^\/]+)\/(.*)$/;
  var raw=/^https:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.*)$/;
  var BINARY=/\.(part[-.\w]*|unityweb|wasm|data|pck|dat|bin|unx|mp4)(\?.*)?$/i;
  function alt(u){
    var m=jd.exec(u); if(m) return "https://raw.githubusercontent.com/"+m[1]+"/"+m[2]+"/"+m[3]+"/"+m[4];
    m=raw.exec(u); if(m) return "https://cdn.jsdelivr.net/gh/"+m[1]+"/"+m[2]+"@"+m[3]+"/"+m[4];
    return null;
  }
  function bad(r,u){
    if(!r.ok) return true;
    var cl=+r.headers.get("content-length");
    return !!(cl&&cl<2000&&BINARY.test(u));
  }
  window.fetch=function(input,init){
    var u=typeof input==="string"?input:(input instanceof URL?input.href:(input&&input.url));
    var a=u&&alt(u);
    if(!a) return of(input,init);
    return of(input,init).then(function(r){
      if(!bad(r,u)) return r;
      return of(a,init).then(function(r2){ return bad(r2,u)?r:r2; },function(){ return r; });
    },function(e){
      return of(a,init).catch(function(){ throw e; });
    });
  };
})();
</script>
<script>
/* This version of the game's own script asks for its music files on the repo's latest branch, where they have since been
   deleted. Those requests are pointed at the complete version this page is pinned to. */
(function(){
  var f=window.fetch.bind(window);
  window.fetch=function(input,init){
    var u=typeof input==="string"?input:(input instanceof URL?input.href:(input&&input.url));
    if(u&&u.indexOf("Unblocked-Games@main/diceamillion/")>=0) input=u.replace("Unblocked-Games@main/diceamillion/","Unblocked-Games@c963cef/diceamillion/");
    return f(input,init);
  };
})();
</script>

  <script>
  const canvas = document.getElementById('canvas');

  const origSetProperty = canvas.style.setProperty.bind(canvas.style);
  canvas.style.setProperty = function(prop, val, priority) {
    if (prop === 'width' || prop === 'height') return;
    return origSetProperty(prop, val, priority);
  };

  ['width', 'height'].forEach(prop => {
    Object.defineProperty(canvas.style, prop, {
      set: function() {},
      get: function() { return ''; },
      configurable: true
    });
  });

  function scaleCanvas() {
    const cw = canvas.width;
    const ch = canvas.height;
    if (!cw || !ch) return;
    const scaleX = window.innerWidth / cw;
    const scaleY = window.innerHeight / ch;
    canvas.style.transform = `scale(${scaleX}, ${scaleY})`;
  }

  new MutationObserver(scaleCanvas).observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });
  window.addEventListener('resize', scaleCanvas);
  setInterval(scaleCanvas, 200);
  </script>

  <script>
  (async function() {
    const BASE = 'https://cdn.jsdelivr.net/gh/NotRexed/Unblocked-Games@c963cef/diceamillion/';
    const res = await fetch(BASE + 'runner.js');
    let text = await res.text();
    text = text.replace(/new Worker\(["']([^"']+)["']\)/g, (match, url) => {
      if (!url.startsWith('http')) return `new Worker("${BASE}${url}")`;
      return match;
    });
    const blob = new Blob([text], { type: 'application/javascript' });
    const script = document.createElement('script');
    script.src = URL.createObjectURL(blob);
    document.body.appendChild(script);
  })();
  </script>
