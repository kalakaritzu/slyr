<style>
:root{
  --bg:#f6f6f4;--surface:#fff;--ink:#16161a;--mute:#74747c;--line:#e4e4e0;--hover:#ecece8;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111113;--surface:#1a1a1d;--ink:#f2f2f0;--mute:#9a9aa2;--line:#2a2a2e;--hover:#1d1d21;
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{background:#060203;scrollbar-gutter:stable}   /* the scrollbar's space stays reserved, so locking and unlocking scroll never shifts the layout sideways */
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* layout: sidebar on the left, games on the right */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:hidden;background:#060203;border-right:1px solid rgba(255,43,43,.22);color:var(--ink);--ink:#f2f2f0;--mute:#e2d0d2;--line:rgba(255,255,255,.14);--surface:rgba(6,2,3,.72);--hover:rgba(255,255,255,.09);--bg:#060203}
.side canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:brightness(1.3)}
.side-body{position:relative;z-index:1;text-shadow:0 0 7px #060203,0 0 3px #060203,0 1px 1px #060203;height:100%;overflow-y:auto;padding:22px 0;display:flex;flex-direction:column;gap:20px}
.logo{display:block;padding:0 16px;color:var(--ink)}
.logo svg{display:block;height:92px;width:auto}
.search{width:calc(100% - 32px);margin:0 16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s}
.search::placeholder{color:var(--mute)}
.search:focus{outline:none;border-color:var(--ink)}
.home{display:flex;align-items:center;gap:9px;margin:0 16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);transition:background .15s,border-color .15s}
.home svg{width:16px;height:16px;flex:none;fill:currentColor}
.home:hover{background:var(--hover);border-color:var(--ink)}
.label{margin:0 16px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cats{display:flex;flex-direction:column;gap:0}
.cat{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 16px;border-radius:0;font-weight:500;color:var(--mute);transition:background .15s,color .15s}
.cat:hover{background:var(--hover);color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);text-shadow:none}
.cat small{font-size:12px;opacity:.9}

/* games: tiles sit edge to edge, no gaps */
.side canvas.gl,#mainBg.gl{filter:none}
#mainBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;filter:brightness(1.3)}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:0;align-content:start;background:transparent}
@media(min-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1700px){.grid{grid-template-columns:repeat(4,1fr)}}

.tile{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#000;isolation:isolate}
.tile .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,hsl(var(--h) 55% 30%),hsl(calc(var(--h) + 40) 55% 18%))}
.tile .art b{font-size:64px;font-weight:700;letter-spacing:-.03em;color:hsl(var(--h) 70% 80%);opacity:.9}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s cubic-bezier(.2,.8,.1,1)}
.tile:hover img,.tile:focus-visible img{transform:scale(1.07)}

/* black shadow with the title, shown on hover */
.tile .shade{position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;padding:20px;
  background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 45%,rgba(0,0,0,.35) 100%);
  opacity:0;transition:opacity .3s ease}
.tile:hover .shade,.tile:focus-visible .shade{opacity:1}
.tile .shade h3{margin:0;color:#fff;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  transform:translateY(10px);transition:transform .4s cubic-bezier(.2,.8,.1,1)}
.tile:hover .shade h3,.tile:focus-visible .shade h3{transform:none}

/* launch: the thumbnail grows to fill the screen, then the game loads */
html.launching,html.launching body{overflow:hidden}
.launch{position:fixed;z-index:1000;margin:0;overflow:hidden;background:#000 center/cover no-repeat;pointer-events:all}
.launch.art{background:linear-gradient(135deg,hsl(var(--h) 55% 30%),hsl(calc(var(--h) + 40) 55% 18%))}
.launch::before{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .55s ease .15s}
.launch.go::before{opacity:.62}
.launch h3{position:absolute;left:50%;top:50%;margin:0;width:90%;text-align:center;color:#fff;font-size:clamp(28px,5vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1.1;
  opacity:0;transform:translate(-50%,-44%);transition:opacity .45s ease .4s,transform .7s cubic-bezier(.2,.8,.1,1) .4s}
.launch.go h3{opacity:1;transform:translate(-50%,-50%)}
.launch .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#fff;transform:scaleX(0);transform-origin:0 50%;transition:transform 3s cubic-bezier(.1,.6,.2,1) .6s}
.launch.go .bar{transform:scaleX(.92)}

/* start menu */
.menu{display:none;position:fixed;inset:0;z-index:200;background:#060203;overflow:hidden;will-change:transform;
  transition:transform .95s cubic-bezier(.22,1,.36,1)}
html.menu-open .menu,html.menu-open-leaving .menu{display:block}
html.menu-open,html.menu-open body{overflow:hidden}
.menu.out{transform:translateY(-100%);pointer-events:none}
.menu.exit .m-title .l span{transform:translateY(-118%);transition:transform .8s cubic-bezier(.22,1,.36,1) calc(var(--i)*.03s)}
.menu.exit .m-link .t{transform:translateY(-118%);transition:transform .8s cubic-bezier(.22,1,.36,1) calc(var(--n)*.04s)}
.menu.exit .m-gh{transform:translateY(-70px);transition:transform .8s cubic-bezier(.22,1,.36,1)}
.menu.exit .m-reaper{transform:translateY(112%);transition:transform .9s cubic-bezier(.22,1,.36,1)}
.menu.exit .m-reaper svg,.menu.exit .m-reaper .back,.menu.exit .m-embers i{animation-play-state:paused}
/* parked above the screen, the start screen runs nothing at all */
.menu.out *,.menu.out::after{animation-play-state:paused!important}
/* coming back from the games: the start screen drops over the page like a curtain, with a soft shadow along its edge */
.menu.back{transition:transform .72s cubic-bezier(.45,0,.1,1);box-shadow:0 40px 90px rgba(0,0,0,.6)}
.menu.back .m-gh{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.menu.back .m-reaper{transition:transform .8s cubic-bezier(.16,1,.3,1)}
.app{background:#060203}
@keyframes m-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
html.bgin .side canvas,html.bgin #mainBg{animation:m-wipe 1.8s cubic-bezier(.22,1,.36,1) backwards}
.menu canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:blur(5px) brightness(.8);transform:scale(1.04);
  animation:m-fade 1s ease-out backwards}
.menu::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 68% 50%,rgba(6,2,3,.55),rgba(6,2,3,.12) 70%,transparent),radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(6,2,3,.6))}
.m-glow{position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:radial-gradient(420px 420px at var(--mx,70%) var(--my,40%),rgba(255,43,43,.16),transparent 70%);animation:m-fade 1.2s ease-out .15s backwards}
.m-embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.m-embers i{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#ff4a3a;
  box-shadow:0 0 10px 2px rgba(255,60,40,.55);opacity:0;animation:m-ember var(--d) linear var(--w) infinite}
@keyframes m-ember{0%{transform:translate(0,0);opacity:0}12%{opacity:.8}80%{opacity:.35}100%{transform:translate(var(--dx),-108vh);opacity:0}}

/* reaper, bottom left, with a cast shadow and a red backlight */
.m-reaper{position:absolute;left:calc(var(--rh)*-.07);bottom:calc(var(--rh)*-.05);height:var(--rh);width:calc(var(--rh)*1.132);
  --rh:min(66vh,620px,38vw);pointer-events:none;animation:m-reaper 1.1s cubic-bezier(.16,1,.3,1) .1s backwards}
.m-reaper .par{position:absolute;inset:0;transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform .9s cubic-bezier(.16,1,.3,1)}
.m-reaper .back{position:absolute;left:-20%;right:-30%;top:-8%;bottom:-20%;
  background:radial-gradient(closest-side at 55% 58%,rgba(255,43,43,.34),rgba(255,43,43,.1) 55%,transparent 100%);animation:m-breathe 6s ease-in-out infinite}
.m-reaper .floor{position:absolute;left:-14%;right:-30%;bottom:-3%;height:18%;
  background:radial-gradient(closest-side,rgba(0,0,0,.92),rgba(0,0,0,.55) 55%,transparent);filter:blur(14px)}
.m-reaper svg{position:absolute;inset:0;width:100%;height:100%;display:block;color:#f4f1ee;transform:scaleX(-1);overflow:visible;
  filter:drop-shadow(26px 22px 22px rgba(0,0,0,.85)) drop-shadow(0 0 60px rgba(0,0,0,.65));animation:m-sway 9s ease-in-out infinite;transform-origin:50% 100%}
@keyframes m-reaper{from{opacity:0;transform:translateY(7%)}to{opacity:1;transform:none}}
@keyframes m-sway{0%,100%{transform:scaleX(-1) rotate(0deg)}50%{transform:scaleX(-1) translateY(-6px) rotate(-.5deg)}}
@keyframes m-breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

/* the words */
.m-inner{position:absolute;top:0;bottom:0;right:clamp(28px,9vw,150px);width:min(46vw,620px);display:flex;flex-direction:column;justify-content:center;
  font-family:'Bricolage Grotesque',var(--font);z-index:2}
.m-title{margin:0;display:flex;font-weight:800;font-size:clamp(84px,15vw,220px);line-height:.82;letter-spacing:-.045em;color:#f6f2ee;
  font-optical-sizing:auto;filter:drop-shadow(0 10px 28px rgba(0,0,0,.55))}
.m-title .l{display:block;overflow:hidden;padding:.04em .01em .1em;margin:-.04em -.01em -.1em}
.m-title .l span{display:block;animation:m-letter .9s cubic-bezier(.16,1,.3,1) calc(.1s + var(--i)*.06s) backwards}
.m-title .l:last-child span{color:#ff2b2b}
@keyframes m-letter{from{transform:translateY(112%) rotate(7deg)}to{transform:none}}
.m-gh{align-self:flex-start;margin:clamp(14px,2.4vh,26px) 0 0 .35em;font:800 clamp(15px,1.5vw,19px)/1 'Bricolage Grotesque',var(--font);letter-spacing:.02em;
  color:rgba(246,242,238,.72);text-decoration:none;position:relative;padding:4px 0;transition:color .3s ease;animation:m-rise .8s cubic-bezier(.16,1,.3,1) .45s backwards}
.m-gh::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#ff2b2b;transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.m-gh{outline:none}
.m-gh:hover,html.kb .m-gh:focus-visible{color:#fff}
.m-gh:hover::after,html.kb .m-gh:focus-visible::after{transform:scaleX(1)}
.m-nav{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(2px,1vh,10px);margin-top:clamp(34px,7vh,78px)}
.m-link{appearance:none;border:0;background:none;padding:0 0 0 0;margin:0;font:800 clamp(40px,5.6vw,76px)/1.04 'Bricolage Grotesque',var(--font);letter-spacing:-.03em;
  color:#f6f2ee;text-decoration:none;cursor:pointer;display:inline-block;position:relative;overflow:hidden;padding-bottom:.08em;
  transition:color .35s ease,opacity .45s ease,transform .6s cubic-bezier(.16,1,.3,1)}
.m-link .t{display:block;animation:m-letter .85s cubic-bezier(.16,1,.3,1) calc(.3s + var(--n)*.07s) backwards}
.m-link .t::before{content:"";display:inline-block;width:0;height:.09em;margin-right:0;vertical-align:.28em;background:#ff2b2b;
  transition:width .55s cubic-bezier(.16,1,.3,1),margin-right .55s cubic-bezier(.16,1,.3,1)}
.m-nav:hover .m-link:not(:hover){opacity:.32}
.m-link{outline:none}
.m-link:hover,html.kb .m-link:focus-visible{color:#ff2b2b;transform:translateX(10px)}
.m-link:hover .t::before,html.kb .m-link:focus-visible .t::before{width:.62em;margin-right:.18em}
.m-link:active{transform:translateX(10px) scale(.98)}
.m-link[aria-disabled=true]{cursor:default;color:rgba(246,242,238,.38)}
.m-link[aria-disabled=true]:hover{color:rgba(246,242,238,.38);transform:none}
.m-link[aria-disabled=true]:hover .t::before{width:0;margin-right:0}
.m-nav:hover .m-link[aria-disabled=true]:not(:hover){opacity:.2}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:760px){
  .m-inner{right:0;left:0;width:auto;align-items:center;justify-content:flex-start;padding-top:9vh;text-align:center}
  .m-title{font-size:clamp(84px,26vw,150px)}
  .m-gh{align-self:center;margin-left:0}
  .m-nav{align-items:center;margin-top:5vh}
  .m-reaper{--rh:min(44vh,360px)}
}
@media(prefers-reduced-motion:reduce){.menu{transition:none}.menu *,.menu canvas,.menu::after{animation:none!important}.m-reaper .par{transition:none}}
.tile[hidden],.empty[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.empty{grid-column:1/-1;margin:0;padding:40px 24px;color:var(--mute)}

/* narrow screens: sidebar turns into a bar on top */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid rgba(255,43,43,.22)}
  .side-body{height:auto;overflow:visible;padding:14px 16px;gap:12px}
  .logo{padding:0}
  .logo svg{height:46px}
  .search{width:100%;margin:0}
  .home{margin:0}
  .label{display:none}
  .cats{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .cat{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .cat[aria-pressed="true"]{border-color:var(--ink)}
}
@media(min-width:560px) and (max-width:959px){.grid{grid-template-columns:repeat(2,1fr)}}

/* touch screens have no hover, so keep the title readable */
@media(hover:none){
  .tile .shade{opacity:1;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
  .tile .shade h3{transform:none;font-size:18px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>

  const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;

  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}

/* each game loads in this tab, full screen (browser back returns here) */
function tile(g){
  const a=mk('a',{className:'tile',href:g.url});
  a.dataset.id=g.id;
  a.setAttribute('aria-label','Play '+g.title);
  a.style.setProperty('--h',hash(g.title)%360);
  const art=mk('div',{className:'art'});
  art.append(mk('b',{textContent:(g.title.match(/[A-Za-z0-9]/)||['#'])[0].toUpperCase()}));
  a.append(art);
  if(g.thumb){
    const img=mk('img',{alt:'',loading:'lazy',decoding:'async',referrerPolicy:'no-referrer',src:g.thumb});
    img.onerror=()=>img.remove();
    a.append(img);
  }
  const shade=mk('div',{className:'shade'});
  shade.append(mk('h3',{textContent:g.title}));
  a.append(shade);
  a.addEventListener('click',e=>{
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;  /* let new-tab clicks work normally */
    e.preventDefault();
    launch(a,g);
  });

}

let launching=null;
function launch(a,g){
  if(launching)return;
  const r=a.getBoundingClientRect();
  const vw=document.documentElement.clientWidth,vh=innerHeight;
  const img=a.querySelector('img');
  const ov=mk('div',{className:'launch'});
  ov.style.setProperty('--h',a.style.getPropertyValue('--h'));
  if(img&&img.complete&&img.naturalWidth)ov.style.backgroundImage='url("'+img.src+'")';
  else ov.classList.add('art');
  ov.append(mk('h3',{textContent:g.title}),mk('div',{className:'bar'}));
  ov.style.cssText+=';left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
  document.body.append(ov);
  document.documentElement.classList.add('launching');
  launching=ov;
  let gone=false;
  const go=()=>{if(gone)return;gone=true;location.href=g.url};
  if(reduce){go();return}
  void ov.offsetWidth;   /* commit the start state so the transitions run */
  ov.classList.add('go');
  const an=ov.animate([
    {left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'},
    {left:'0px',top:'0px',width:vw+'px',height:vh+'px'}
  ],{duration:700,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
  an.onfinish=()=>setTimeout(go,150);
  setTimeout(go,1200);   /* safety net */
}

function setQuery(q){
  words=norm(q).split(' ').filter(Boolean);

/* games are built once; filtering animates them in, out and into their new spots */
const EASE='cubic-bezier(.16,1,.3,1)';
const grid=$('#grid');
const tiles=GAMES.map(g=>{const t=tile(g);grid.append(t);return t});
const empty=mk('p',{className:'empty',textContent:'No games found.',hidden:true});
grid.append(empty);
let settle=null;
const unpin=t=>{t._leaving=false;t.hidden=true;['position','left','top','width','height','pointerEvents','zIndex'].forEach(k=>t.style[k]='')};

function renderGames(animate){
  const wanted=new Set(GAMES.filter(matches).map(g=>g.id));
  const want=t=>wanted.has(t.dataset.id);
  if(!animate||reduce){
    tiles.forEach(t=>{t._leaving&&unpin(t);t.hidden=!want(t)});
    empty.hidden=wanted.size>0;
    return;
  }
  tiles.forEach(t=>{if(t._leaving)unpin(t)});            /* finish any fade-out still running */
  const gr=grid.getBoundingClientRect();
  const first=new Map();
  tiles.forEach(t=>{if(!t.hidden)first.set(t,t.getBoundingClientRect())});
  tiles.forEach(t=>t.getAnimations().forEach(a=>a.cancel()));
  empty.getAnimations().forEach(a=>a.cancel());

  const stay=[],enter=[],leave=[];
  tiles.forEach(t=>{const w=want(t),was=first.has(t);if(w&&was)stay.push(t);else if(w)enter.push(t);else if(was)leave.push(t)});

  /* hold the page height steady while things move */
  clearTimeout(settle);grid.style.minHeight=gr.height+'px';settle=setTimeout(()=>{grid.style.minHeight=''},800);

  leave.forEach(t=>{                                       /* pin in place, fade out */
    const r=first.get(t);
    t._leaving=true;
    Object.assign(t.style,{position:'absolute',left:(r.left-gr.left)+'px',top:(r.top-gr.top)+'px',width:r.width+'px',height:r.height+'px',pointerEvents:'none',zIndex:'2'});
  });
  enter.forEach(t=>{t.hidden=false});
  empty.hidden=wanted.size>0;

  leave.forEach(t=>{
    t.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.88)'}],{duration:420,easing:'cubic-bezier(.33,1,.68,1)',fill:'forwards'})
      .onfinish=()=>{if(t._leaving)unpin(t)};
    const id=t._leaveId=(t._leaveId||0)+1;
    setTimeout(()=>{if(t._leaving&&t._leaveId===id)unpin(t)},700);   /* backup in case the finish event never fires */
  });
  stay.forEach(t=>{                                        /* glide to the new spot */
    const f=first.get(t),l=t.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(dx||dy)t.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:650,easing:EASE});
  });
  enter.forEach(t=>{                                   /* rise in, slightly staggered */
    t.animate([{opacity:0,transform:'scale(.94) translateY(14px)'},{opacity:1,transform:'none'}],
      {duration:600,easing:EASE,fill:'backwards'});
  });
  if(!empty.hidden)empty.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:500,easing:EASE,fill:'backwards'});
}
$('#search').addEventListener('input',e=>{setQuery(e.target.value);renderGames(true)});

/* ---------- animated red contour lines (start menu + sidebar) ---------- */
function createContours2D(cv,o){
  o=Object.assign({maxDpr:1.25,fps:60,major:1.8,minor:0.9,alphaMajor:1,alphaMinor:0.8,dim:1,zoom:1,lo:[92,11,18],hi:[255,43,43],parent:false},o||{});
  const ctx=cv.getContext('2d');
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(window.devicePixelRatio||1,o.maxDpr);
  let W=1,H=1,cell=8,cols=1,rows=1,field=new Float32Array(4),t=Math.random()*20,last=performance.now(),lastDraw=0,raf=0,running=false,wanted=false,painted=false;
  const LEVELS=[];for(let l=-2;l<=2.0001;l+=0.25)LEVELS.push(+l.toFixed(2));
  function resize(){
    const w=o.parent?cv.parentElement.clientWidth:innerWidth,h=o.parent?cv.parentElement.clientHeight:innerHeight;
    W=cv.width=Math.max(2,Math.floor(w*dpr));H=cv.height=Math.max(2,Math.floor(h*dpr));
    cell=Math.max(6,Math.round(7*dpr));cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);
    field=new Float32Array((cols+1)*(rows+1));
    if(running||painted)draw();            /* resizing wipes a canvas, so repaint even while paused */
  }
  function fill(tt){
    const asp=W/H,z=o.zoom;let k=0;
    const cx=1.6*Math.cos(tt*0.21)*z,cy=1.0*Math.sin(tt*0.17)*z;
    for(let j=0;j<=rows;j++){
      const v=((j/rows)*4-2)*z;
      for(let i=0;i<=cols;i++){
        const u=((i/cols)*4-2)*asp*z;
        field[k++]=
          0.55*Math.sin(u*1.3+tt*0.40+1.5*Math.sin(v*0.9-tt*0.30))+
          0.55*Math.sin(v*1.7-tt*0.35+1.2*Math.sin(u*0.8+tt*0.25))+
          0.40*Math.sin((u+v)*1.1+tt*0.20)+
          0.65*Math.sin(Math.hypot(u-cx*asp,v-cy)*1.8-tt*0.60);
      }
    }
  }
  /* marching squares edge pairs: 0 top, 1 right, 2 bottom, 3 left */
  const TB=[[],[[3,2]],[[2,1]],[[3,1]],[[0,1]],[[0,3],[2,1]],[[0,2]],[[0,3]],[[0,3]],[[0,2]],[[0,1],[3,2]],[[0,1]],[[3,1]],[[2,1]],[[3,2]],[]];
  const pts=new Array(8).fill(0);
  function contour(L){
    const stride=cols+1;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const p=j*stride+i,a=field[p],b=field[p+1],c=field[p+stride+1],d=field[p+stride];
      const idx=(a>L?8:0)|(b>L?4:0)|(c>L?2:0)|(d>L?1:0);
      if(idx===0||idx===15)continue;
      const x0=i*cell,y0=j*cell;
      pts[0]=x0+cell*(L-a)/(b-a);pts[1]=y0;
      pts[2]=x0+cell;pts[3]=y0+cell*(L-b)/(c-b);
      pts[4]=x0+cell*(L-d)/(c-d);pts[5]=y0+cell;
      pts[6]=x0;pts[7]=y0+cell*(L-a)/(d-a);
      const segs=TB[idx];
      for(let q=0;q<segs.length;q++){
        const e1=segs[q][0]*2,e2=segs[q][1]*2;
        ctx.moveTo(pts[e1],pts[e1+1]);ctx.lineTo(pts[e2],pts[e2+1]);
      }
    }
  }
  const mix=x=>'rgb('+Math.round(o.lo[0]+(o.hi[0]-o.lo[0])*x)+','+Math.round(o.lo[1]+(o.hi[1]-o.lo[1])*x)+','+Math.round(o.lo[2]+(o.hi[2]-o.lo[2])*x)+')';
  function draw(){
    painted=true;
    ctx.fillStyle='#060203';ctx.fillRect(0,0,W,H);
    fill(t);ctx.lineCap='round';
    for(let n=0;n<LEVELS.length;n++){
      const major=n%4===0;
      ctx.beginPath();contour(LEVELS[n]);
      ctx.strokeStyle=mix(n/(LEVELS.length-1));
      ctx.lineWidth=(major?o.major:o.minor)*dpr;
      ctx.globalAlpha=(major?o.alphaMajor:o.alphaMinor)*o.dim;ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  function frame(now){
    if(!running)return;
    raf=requestAnimationFrame(frame);
    if(now-lastDraw<1000/o.fps-2)return;
    const dt=Math.min(0.05,(now-last)/1000);last=now;lastDraw=now;
    t+=dt*(calm?0.08:0.5);

  }
  function run(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame)}
  function halt(){running=false;cancelAnimationFrame(raf)}
  const onVis=()=>{if(!wanted)return;if(document.hidden)halt();else run()};
  document.addEventListener('visibilitychange',onVis);
  let ro=null;
  if(o.parent&&window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement)}
  else addEventListener('resize',resize);
  resize();
  return{
    start(){wanted=true;draw();if(!document.hidden)run()},
    stop(){wanted=false;halt()},
    ensure(){if(!painted)draw()},          /* one picture if there has never been one, and nothing more */
    destroy(){wanted=false;halt();document.removeEventListener('visibilitychange',onVis);removeEventListener('resize',resize);if(ro)ro.disconnect()}
  };
}

/* ---------- topo lines on the GPU: layered simplex noise, thin on steep ground and fat on flat ground ---------- */
const TOPO_VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
const TOPO_BODY=`

vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}

vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);

  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;

  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));

  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;

}
float field(vec2 uv,float z){
  float f=0.0;

  f+=snoise(vec3(uv*2.1+7.3,z*1.3))*0.28;
  f+=snoise(vec3(uv*4.3+19.1,z*1.7))*0.12;
  f+=snoise(vec3(uv*8.7+3.7,z*2.1))*0.05;
  return f;
}

  vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;
  uv*=uvs;
  float z=t*0.045;
  float h=field(uv,z);
  float v=h*13.0;
  float line=abs(fract(v+0.5)-0.5);
#ifdef NO_DERIV
  float fw=0.03;
#else
  float fw=fwidth(v);
#endif
  float width=0.055+fw*0.55;
  float a=1.0-smoothstep(width-fw*0.8,width+fw*0.8,line);
  vec3 red=vec3(1.0,0.09,0.09);
  vec3 base=vec3(0.024,0.008,0.012);
  gl_FragColor=vec4(base+red*a*inten,1.0);
}`;
const topoSource=deriv=>(deriv?'#extension GL_OES_standard_derivatives : enable\n':'#define NO_DERIV\n')+'precision highp float;\n'+TOPO_BODY;

/* can this browser run the shader? checked once on a throw-away canvas */
const TOPO_GL=(()=>{
  try{
    const c=document.createElement('canvas'),gl=c.getContext('webgl',{antialias:false});
    if(!gl)return null;
    const deriv=!!gl.getExtension('OES_standard_derivatives');
    const sh=(type,src)=>{const x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader(x);return gl.getShaderParameter(x,gl.COMPILE_STATUS)?x:null};
    const v=sh(gl.VERTEX_SHADER,TOPO_VERT),f=sh(gl.FRAGMENT_SHADER,topoSource(deriv));
    if(!v||!f)return null;
    const pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
    const ok=gl.getProgramParameter(pr,gl.LINK_STATUS);
    const lose=gl.getExtension('WEBGL_lose_context');if(lose)lose.loseContext();
    return ok?{deriv}:null;
  }catch(e){return null}
})();

function createTopoGL(cv,o){
  o=Object.assign({fps:30,dim:1,zoom:1,scale:1,parent:false},o||{});
  const gl=cv.getContext('webgl',{antialias:false,alpha:false});
  cv.classList.add('gl');
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(TOPO_GL.deriv)gl.getExtension('OES_standard_derivatives');
  const mkShader=(type,src)=>{const x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader(x);return x};
  const prog=gl.createProgram();
  gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,TOPO_VERT));
  gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,topoSource(TOPO_GL.deriv)));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'res'),uT=gl.getUniformLocation(prog,'t'),uI=gl.getUniformLocation(prog,'inten'),uS=gl.getUniformLocation(prog,'uvs');
  let t=40+Math.random()*30,last=performance.now(),lastDraw=0,raf=0,running=false,wanted=false,painted=false;
  function resize(){
    const w=o.parent?cv.parentElement.clientWidth:innerWidth,h=o.parent?cv.parentElement.clientHeight:innerHeight;
    const k=Math.min(window.devicePixelRatio||1,1)*o.scale;       /* lines are soft anyway, so a lighter render is fine */
    cv.width=Math.max(2,Math.floor(w*k));cv.height=Math.max(2,Math.floor(h*k));
    gl.viewport(0,0,cv.width,cv.height);
    if(wanted||painted)draw();             /* resizing wipes a canvas, so repaint even while paused */
  }
  function draw(){
    painted=true;
    gl.uniform2f(uRes,cv.width,cv.height);gl.uniform1f(uT,t);gl.uniform1f(uI,o.dim);gl.uniform1f(uS,3.2*o.zoom);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function frame(now){
    if(!running)return;
    raf=requestAnimationFrame(frame);
    if(now-lastDraw<1000/o.fps-2)return;
    const dt=Math.min(0.05,(now-last)/1000);last=now;lastDraw=now;
    t+=dt*(calm?0.08:1);
    draw();
  }
  function run(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame)}
  function halt(){running=false;cancelAnimationFrame(raf)}
  const onVis=()=>{if(!wanted)return;if(document.hidden)halt();else run()};
  document.addEventListener('visibilitychange',onVis);
  let ro=null;
  if(o.parent&&window.ResizeObserver){ro=new ResizeObserver(resize);ro.observe(cv.parentElement)}
  else addEventListener('resize',resize);
  resize();
  return{
    start(){wanted=true;draw();if(!document.hidden)run()},
    stop(){wanted=false;halt()},
    ensure(){if(!painted)draw()},          /* one picture if there has never been one, and nothing more */
    destroy(){
      wanted=false;halt();document.removeEventListener('visibilitychange',onVis);removeEventListener('resize',resize);if(ro)ro.disconnect();
      const lose=gl.getExtension('WEBGL_lose_context');if(lose)lose.loseContext();
    }
  };
}
function createContours(cv,o){return TOPO_GL?createTopoGL(cv,Object.assign({},o,(o&&o.gl)||{})):createContours2D(cv,o)}

/* ---------- start menu, then the sidebar background ---------- */
(function(){
  const side=createContours($('#sideBg'),{parent:true,fps:30,dim:0.7,major:1.4,minor:0.7,zoom:1.9,gl:{dim:0.26,zoom:0.8}});
  const main=createContours($('#mainBg'),{fps:24,dim:0.6,major:1.4,minor:0.7,zoom:1.2,gl:{dim:0.2,zoom:0.8}});
  const menu=$('#menu'),app=$('#app'),play=$('#play');
  if(!menu||!document.documentElement.classList.contains('menu-open')){if(menu)menu.remove();side.start();main.start();return}
  app.inert=true;
  tiles.slice(0,18).forEach(tl=>{const im=tl.querySelector('img');if(im){im.loading='eager';if(im.decode)im.decode().catch(()=>{})}});
  const BGOPT={dim:0.6,gl:{dim:0.55,zoom:0.45}};
  let bg=createContours($('#bg'),BGOPT);
  bg.start();
  play.focus({preventScroll:true});

  let left=false,busy=false;
  function enter(){
    if(left||busy)return;left=true;busy=true;
    const root=document.documentElement;
    app.inert=false;                                          /* the topo behind the page was drawn once while the menu showed, so nothing underneath is ever black */
    side.ensure();main.ensure();                              /* and if nothing drew it yet, it is drawn now, before the first frame of the reveal */
    let fin=false,onEnd=null;
    /* the panel is not thrown away: it stays parked above the screen, ready to come back down */
    const done=()=>{if(fin)return;fin=true;if(onEnd)menu.removeEventListener('transitionend',onEnd);bg.stop();
      root.classList.remove('menu-open');root.classList.add('menu-open-leaving');menu.inert=true;busy=false};   /* the page stays unscrollable until the end, so no scrollbar can jolt the layout */
    if(calm){menu.classList.add('out');done();side.start();main.start();return}
    /* the click's own frame can be a heavy one while the page wakes up, so the motion starts two frames later and begins cleanly */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      menu.classList.add('exit');                             /* title, words and reaper drift away, each on its own */
      menu.classList.add('out');reveal();                     /* the panel lifts away at once while the page builds itself underneath */
      setTimeout(()=>{bg.stop();side.start()},800);           /* the page's two moving backgrounds start only once the panel has almost left, one at a time, so no frame has to do two jobs */
      setTimeout(()=>main.start(),1150);
      onEnd=e=>{if(e.target===menu&&e.propertyName==='transform'&&menu.classList.contains('out'))done()};
      menu.addEventListener('transitionend',onEnd);
    }));
    setTimeout(done,2600);                                    /* safety net */
  }

  /* the way back: the page stays still and sinks back a little while the start screen drops over it like a curtain;
     as it lands, the title and words rise in with the same intro the site opens with. Only transforms move. */
  const RISE='cubic-bezier(.16,1,.3,1)';
  function intro(){
    menu.classList.remove('exit');            /* the gh link and the reaper glide in on their own; the letters and words are replayed below */
    menu.querySelectorAll('.m-title .l span').forEach((el,i)=>el.animate([{transform:'translateY(112%) rotate(7deg)'},{transform:'none'}],{duration:700,delay:40+i*45,easing:RISE,fill:'backwards'}));
    menu.querySelectorAll('.m-link .t').forEach((el,n)=>el.animate([{transform:'translateY(112%) rotate(7deg)'},{transform:'none'}],{duration:680,delay:180+n*55,easing:RISE,fill:'backwards'}));
  }
  function goHome(){
    if(!left||busy)return;busy=true;
    const root=document.documentElement;
    app.inert=true;
    side.stop();main.stop();                                  /* the page's moving lines pause (their last picture stays), so the graphics card only has the curtain to do */
    bg.start();requestAnimationFrame(()=>requestAnimationFrame(()=>bg.stop()));   /* the menu's own picture is refreshed once, then held still until it has landed */
    let fin=false,onBack=null;
    const finish=()=>{if(fin)return;fin=true;if(onBack)menu.removeEventListener('transitionend',onBack);
      menu.classList.remove('back');
      root.classList.remove('menu-open-leaving');root.classList.add('menu-open');
      scrollTo(0,0);
      bg.start();                                             /* the lines behind the menu start moving again once everything has settled */
      left=false;menu.inert=false;play.focus({preventScroll:true});
      setTimeout(()=>{busy=false},900)};                      /* Ports stays locked until the title has finished rising */
    if(calm){menu.classList.remove('out','exit');finish();busy=false;return}
    root.classList.add('menu-open-leaving');
    void menu.offsetWidth;                                    /* commit the parked state so the transitions start from it */
    menu.inert=false;
    menu.classList.add('back');
    menu.classList.remove('out');                             /* the curtain drops; the words stay hidden above until it is nearly down */
    setTimeout(intro,260);
    onBack=e=>{if(e.target===menu&&e.propertyName==='transform'&&!menu.classList.contains('out'))finish()};
    menu.addEventListener('transitionend',onBack);
    setTimeout(finish,1800);                                  /* safety net */
  }
  const homeBtn=$('#home');
  if(homeBtn)homeBtn.addEventListener('click',e=>{
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;   /* new-tab clicks work normally */
    e.preventDefault();goHome();
  });
  /* everything on the page moves into place with a long ease-out; nothing fades */
  const EO='cubic-bezier(.22,1,.36,1)';
  const slide=(el,delay,from,dur)=>{if(el)el.animate([{transform:from},{transform:'none'}],{duration:dur,delay:delay,easing:EO,fill:'backwards'})};
  function reveal(){
    slide(document.querySelector('.side'),0,'translateX(-100%)',950);
    slide($('#search'),40,'translateX(-260px)',950);
    slide(document.querySelector('.side .label'),80,'translateX(-260px)',950);
    document.querySelectorAll('#cats .cat').forEach((b,k)=>slide(b,100+k*26,'translateX(-260px)',950));
    const vh=innerHeight,gr=$('#grid').getBoundingClientRect();
    const seen=tiles.filter(tl=>!tl.hidden&&tl.getBoundingClientRect().top<vh);
    const first=seen.length?seen[0].getBoundingClientRect():null;
    seen.forEach(tl=>{
      const r=tl.getBoundingClientRect();
      const col=Math.round((r.left-gr.left)/(first.width||1)),row=Math.round((r.top-first.top)/(first.height||1));
      const delay=60+(row*2+col)*55;                        /* a diagonal wave from the top left */
      tl.animate([{transform:'translateY(48px)'},{transform:'none'}],{duration:1000,delay:delay,easing:EO,fill:'backwards'});
    });
  }
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* draw the page's topo once, early and out of sight, so starting it later costs nothing; the picture stays on the canvas */
  if(!calm)setTimeout(()=>{if(left)return;side.start();main.start();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!left){side.stop();main.stop()}}))},1600);
  play.addEventListener('click',enter);
  addEventListener('keydown',()=>document.documentElement.classList.add('kb'),{once:true});
  if(!calm){
    const glow=$('#mGlow'),rea=$('#mReaper')&&$('#mReaper').querySelector('.par');
    let raf=0,ex=0,ey=0;
    const move=e=>{ex=e.clientX;ey=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{
      raf=0;const w=innerWidth,h=innerHeight;
      glow.style.setProperty('--mx',ex+'px');glow.style.setProperty('--my',ey+'px');
      if(rea){rea.style.setProperty('--px',((ex/w-.5)*-22).toFixed(1)+'px');rea.style.setProperty('--py',((ey/h-.5)*-12).toFixed(1)+'px')}
    })};
    menu.addEventListener('pointermove',move,{passive:true});
  }
  /* Apps and Discord: put the real address in data-url on the links above; until then they stay inactive */
  ['apps','discord'].forEach(id=>{
    const a=$('#'+id);if(!a)return;
    const u=a.dataset.url;
    if(u){a.href=u;if(id==='discord'){a.target='_blank'}}
    else{a.setAttribute('aria-disabled','true');a.addEventListener('click',e=>e.preventDefault())}
  });
})();

renderCats();
renderGames(false);
})();
</script>
